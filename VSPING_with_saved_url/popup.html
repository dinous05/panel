<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSPING Auto Checker</title><style>
:root{font:13px/1.45 Arial,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{width:370px;margin:0;padding:14px}.card{background:#fff;border:1px solid #e4e8f0;border-radius:12px;padding:13px;margin-bottom:10px;box-shadow:0 2px 8px #1720330a}h1{font-size:17px;margin:0 0 3px}.sub{color:#68758b;font-size:11px;margin-bottom:10px}label{display:block;font-weight:600;margin-bottom:5px}input{width:100%;padding:8px;border:1px solid #ccd4e1;border-radius:7px;font:12px Arial}button{border:0;border-radius:7px;padding:7px 10px;font-weight:600;cursor:pointer;background:#e9edf5;color:#243047}button.primary{background:#2563eb;color:white}button.danger{background:#fee2e2;color:#991b1b}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#f6f8fc;border-radius:8px;padding:7px}.stat b{display:block;font-size:17px}.stat span{font-size:10px;color:#667085}.bar{height:7px;background:#e8edf5;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:#2563eb;transition:width .2s}.meta{font-size:11px;color:#536078;overflow-wrap:anywhere}.log{height:100px;overflow:auto;font:11px/1.5 monospace;color:#364152;white-space:pre-wrap}.error{color:#b42318}.small{font-size:10px;color:#788397}
</style></head><body><section class="card"><h1>VSPING Auto Checker</h1><div class="sub">Kiểm tra danh sách URL từ Google Sheets CSV</div><label for="csv">URL CSV</label><input id="csv" type="url" value="https://docs.google.com/spreadsheets/d/1cArdO_qqgryiUWU1t0wH2OjRFkALcBtMBWZecNPGYtI/export?format=csv&gid=0" placeholder="https://docs.google.com/.../export?format=csv"><div class="actions"><button class="primary" id="start">START</button><button id="pause">PAUSE</button><button id="resume">RESUME</button><button class="danger" id="stop">STOP</button><button id="reset">RESET</button><button id="export">EXPORT CSV</button></div></section><section class="card"><div class="stats"><div class="stat"><b id="total">0</b><span>Tổng URL</span></div><div class="stat"><b id="done">0</b><span>Đã xong</span></div><div class="stat"><b id="success">0</b><span>Thành công</span></div><div class="stat"><b id="failed">0</b><span>Thất bại</span></div><div class="stat"><b id="waiting">0</b><span>Đang chờ</span></div><div class="stat"><b id="percent">0%</b><span>Tiến trình</span></div></div><div class="bar"><i id="bar"></i></div><div class="meta">Trạng thái: <b id="status">Chưa chạy</b></div><div class="meta">URL hiện tại: <span id="current">—</span></div></section><section class="card"><label>Nhật ký</label><div id="error" class="meta error"></div><div id="log" class="log"></div><div class="small">Tiến trình được lưu cục bộ và có thể khôi phục sau khi tải lại trang.</div></section><script src="popup.js"></script></body></html>
